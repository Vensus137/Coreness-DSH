<section class="s s-prose" id="{{id}}"{{?band}} data-band="surface"{{/band}}{{?heading}} aria-labelledby="{{headingId}}"{{/heading}}>
  <div class="wrap">
    {{?number}}<p class="ann ann--number" aria-hidden="true">{{number}}</p>{{/number}}
    <div class="prose stack">
      {{?heading}}<h2 class="t-h1" id="{{headingId}}">{{heading}}</h2>{{/heading}}
      {{#paragraphs}}<p class="t-body">{{.}}</p>{{/paragraphs}}
      {{#pull}}<blockquote class="s-prose__pull t-statement">{{text}}</blockquote><p class="ann ann--caption">{{attribution}}</p>{{/pull}}
    </div>
  </div>
</section>
