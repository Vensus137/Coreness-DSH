<figure class="s s-quote" id="{{id}}"{{?band}} data-band="surface"{{/band}}>
  <div class="wrap">
    {{?number}}<p class="ann ann--number" aria-hidden="true">{{number}}</p>{{/number}}
    <div class="grid">
      <div class="span-8">
        <blockquote class="t-statement">{{text}}</blockquote>
        <figcaption><span class="t-body">{{attribution}}</span>{{?role}}<span class="ann ann--source">{{role}}</span>{{/role}}{{?source}}<span class="ann ann--source">{{source}}</span>{{/source}}</figcaption>
      </div>
    </div>
  </div>
</figure>
