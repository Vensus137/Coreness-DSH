<div class="s s-footer" id="s-footer">
  <div class="wrap row">
    <span class="s-footer__brand">{{brand}}</span>
    {{?line}}<p class="t-small">{{line}}</p>{{/line}}
    {{?links}}<nav class="s-footer__links" aria-label="{{footerLabel}}">{{#links}}<a href="{{href}}">{{label}}</a>{{/links}}</nav>{{/links}}
    {{?note}}<span class="ann ann--caption">{{note}}</span>{{/note}}
  </div>
</div>
