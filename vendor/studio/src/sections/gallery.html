<section class="s s-gallery" id="{{id}}"{{?band}} data-band="surface"{{/band}}{{?heading}} aria-labelledby="{{headingId}}"{{/heading}}>
  <div class="wrap stack">
    {{?number}}<p class="ann ann--number" aria-hidden="true">{{number}}</p>{{/number}}
    {{?heading}}<h2 class="t-h1" id="{{headingId}}">{{heading}}</h2>{{/heading}}
    <ul class="grid s-gallery__list" data-count="{{count}}">
      {{#items}}<li class="s-gallery__tile"><h3 class="t-h3">{{title}}</h3><p class="t-small">{{caption}}</p></li>{{/items}}
    </ul>
  </div>
</section>
