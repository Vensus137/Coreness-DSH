<section class="slide" data-layout="{{layout}}" aria-labelledby="{{headingId}}"{{?hidden}} hidden{{/hidden}}>
  <div class="slide__head"><h2 class="t-h1" id="{{headingId}}">{{heading}}</h2></div>
  <div class="slide__body slide__body--top">
    <ol class="slide__list slide__list--steps">
      {{#steps}}<li class="slide__item">{{?label}}<span class="t-label slide__item-label">{{label}}</span>{{/label}}<span class="t-body slide__item-text">{{text}}</span></li>{{/steps}}
    </ol>
  </div>
  <div class="slide__foot"></div>
</section>
