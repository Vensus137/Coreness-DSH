# The bundle's rows: the page, the journal, the rules, MCP, OAuth, the Qoder route and the rate gate.
- insert:
    - id: coreness-ui
      name: '@coreness/ui'
    - id: coreness-journal
      name: '@coreness/journal'
      config:
        rotationDays: 30
        rotationBytes: 2097152
        recordsLimit: 20
    - id: coreness-rules
      name: '@coreness/rules'
    - id: coreness-mcp
      name: '@coreness/mcp'
    - id: mcp-servers
      name: cordis:include
      config:
        path: ./mcp-servers.yml
        initial: []
    - id: coreness-oauth
      name: '@coreness/oauth'
    - id: coreness-qoder
      name: '@coreness/qoder'
      config:
        apiKeyEnv: QODER_PERSONAL_ACCESS_TOKEN
        firstByteCeilingMs: 60000
        retryPolicy:
          mode: normal
          maxRetries: 5
          retryableCodes:
            - EMPTY_RESPONSE
            - RATE_LIMIT
            - SERVER
            - TIMEOUT
            - TRANSPORT
            - MALFORMED_RESPONSE
          backoff:
            initialDelayMs: 500
            maxDelayMs: 10000
            jitterRatio: 0.1
        credits:
          sweepMs: 600000
          autoClaim: true
    - id: coreness-rate-gate
      name: '@coreness/rate-gate'
      config:
        windowMs: 60000
        maxWaitMs: 60000
        thresholdRatio: 0.9
        dryRun: false
# The Agent Team's own rows belong to the platform's bundle: one row id has one owner, and a profile that
# carries both bundles would declare `agent-team` twice — the Loader keeps the last, and the profile's
# editor refuses to write a row two layers answer for. The product adds its ceiling door and its paragraph,
# and both read the row the platform mounted.
- insert:
    - id: coreness-team
      name: '@coreness/team'
