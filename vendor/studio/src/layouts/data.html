<section class="slide" data-layout="{{layout}}" aria-labelledby="{{headingId}}"{{?hidden}} hidden{{/hidden}}>
  <div class="slide__head"><h2 class="t-h1" id="{{headingId}}">{{heading}}</h2></div>
  <div class="slide__body slide__body--center">
    <p class="t-numeral slide__value">{{value}}{{?unit}} <span class="slide__unit">{{unit}}</span>{{/unit}}</p>
    {{?note}}<p class="t-body slide__note">{{note}}</p>{{/note}}
  </div>
  <div class="slide__foot"><p class="t-label">{{source}}</p></div>
</section>
