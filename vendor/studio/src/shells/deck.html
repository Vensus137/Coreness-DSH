<!doctype html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  {{?description}}<meta name="description" content="{{description}}">{{/description}}
  <link rel="stylesheet" href="assets/site.css">
  <link rel="stylesheet" href="assets/deck.css">
</head>
<body class="look-{{look}}" data-slide="title">
  <main id="main">
    <div class="stage">
      {{>slides}}
      <div class="deck-counter t-label">{{counter}}</div>
      <div class="deck-controls">
        <button type="button" id="deck-prev" class="t-label" disabled>{{prev}}</button>
        <button type="button" id="deck-next" class="t-label">{{next}}</button>
      </div>
    </div>
  </main>
  <script src="assets/present.js"></script>
</body>
</html>
