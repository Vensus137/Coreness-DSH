<div class="s s-cta field" id="{{id}}" aria-labelledby="{{headingId}}">
  <div class="wrap stack">
    <h2 class="t-h1" id="{{headingId}}">{{heading}}</h2>
    {{?body}}<p class="t-lead">{{body}}</p>{{/body}}
    {{#action}}<p class="s-cta__action"><a href="{{href}}">{{label}}</a></p>{{/action}}
    {{?note}}<p class="t-small">{{note}}</p>{{/note}}
  </div>
</div>
