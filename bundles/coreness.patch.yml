# The product's rows: one row per plugin of this package.
#
# The rows live in the bundle rather than beside each plugin: a bundle names its own
# patch files relative to its package root (the manifest's own `dsh.bundle.patch` field),
# and the rows of the product are one assembly — a reader looking for what the product
# mounts reads this file, not a file per plugin. The plugins keep their own code,
# tests and READMEs; a patch of their own would make each of them look like a bundle
# and would give the same rows two possible owners.
#
# `id` is the plugin's name in cordis, `name` is the package specifier the Loader
# resolves: the root of the package for the page (its browser half is the package's
# own `./client`, and one package carries one browser half), and a subpath for the
# journal (host-only — a subpath row carries no browser half, which is exactly what
# it needs).
- insert:
    - id: coreness-page
      name: '@coreness/dsh'

    # The MCP plugin and the file its rows live in.
    #
    # The plugin is host-only: it reads the profile's servers and writes them through
    # the Loader, and the page reaches it by its own route. The second row is the
    # platform's own `cordis:include`, mounted here for the same reason the donor
    # mounted it — a row of a composition is written by the include that owns its
    # file, and a file of its own is what keeps the servers from having a second
    # writer in the profile's patch.
    #
    # The path is relative to the *profile's* directory: every patch row is applied
    # inside the composition the profile's own config file mounts, so the servers file
    # stands under the profile's own directory, beside that composition. The id here is
    # the one the plugin looks for (`INCLUDE_ID`), and `initial: []` lets a fresh
    # profile start with an empty list instead of no file at all.
    - id: coreness-mcp
      name: '@coreness/dsh/plugins/mcp'

    - id: mcp-servers
      name: cordis:include
      config:
        path: ./mcp-servers.yml
        initial: []

    # The journal's row: the limits of its rotation and the limit of its selection.
    # The donor's price setting does not come over — the product does not count the
    # price of a task (the user's decision of 06.10).
    - id: coreness-journal
      name: '@coreness/dsh/plugins/journal'
      config:
        rotationDays: 30
        rotationBytes: 2097152
        recordsLimit: 20

    # The rate gate's row: host-only, like the journal's — it stands at the platform's `llm/stream`
    # waterfall and has no browser half.
    #
    # What this row declares is the *shape* of the gate and not a ceiling: a window of one minute, a
    # wait bound of the same minute, a caution ratio of nine tenths, and no watching. **No row under
    # `limits` names a model** — so the gate mounts, says so in the log, and lets every request
    # through untouched. That is deliberate, and it is the project's own rule — a default is
    # not a declaration: what the product has in mind is written explicitly, while a ceiling is a
    # decision of a profile and not of the bundle. A profile that wants one adds rows under `limits`
    # — one per model, with the ceiling in tokens per window — and the gate then *holds* a request
    # whose window is nearly full instead of refusing it, releasing it when the window moves on or
    # when the wait bound is spent (a request released that way is marked `forced`).
    - id: coreness-rate-gate
      name: '@coreness/dsh/plugins/rate-gate'
      config:
        windowMs: 60000
        maxWaitMs: 60000
        thresholdRatio: 0.9
        dryRun: false

    # The Qoder route's row: host-only, like the journal's — the wire is the host side of the route
    # and has no browser half. Its settings fall in two groups.
    #
    # The route's own facts: the *name* of the credential the token is stored under (the value lives
    # in the platform's own store — `ctx.credentials` — so no secret lies in this file, in a log or in
    # the package), the effort the route asks the vendor for, and the three ceilings of the transport:
    # the first byte's number stands in the row below, the other two take the schema's own defaults.
    #
    # The route's declaration to the platform — the models it advertises — stands in the row schema's
    # own default and is **not** restated here: one list has one owner (`DEFAULT_MODELS`, five rows
    # each naming its own level — `max` for `auto`, `efficient` and `dfmodel`, `xhigh` for the two
    # Qwen rows), and that is what a profile with no patch resolves to. A copy in this file would beat
    # the schema on every `Reset to defaults`, because the patch layers are applied one over another.
    # The windows and the measurement behind them live with that list.
    #
    # The policy is the platform's own shape and its own defaults, with one addition:
    # `MALFORMED_RESPONSE` joins the five retryable codes. One tool call whose arguments do not parse
    # ended whole agent sessions in this project — how many, and the turns that say so, stand in the
    # sessions' own records, not here. Such an attempt carries nothing durable to repeat and a
    # re-ask is a fresh sample — so the step is re-asked instead of the session ending. The list stands
    # here, not in the code, so that it can be narrowed from the row without a code change.
    - id: coreness-qoder
      name: '@coreness/dsh/plugins/provider/qoder'
      config:
        apiKeyEnv: QODER_PERSONAL_ACCESS_TOKEN

        # The first byte of an answer: the code's own default is 15 000 ms, and a cold prompt beyond
        # roughly 1.5–1.9 × 10⁵ tokens is cut before it can speak. A cold turn of 372 190 prompt tokens
        # held the wire silent 31 949 ms and then answered normally, so this row carries the number that
        # does not cut it. The other two ceilings stay unset and take the schema's own defaults.
        firstByteCeilingMs: 60000

        retryPolicy:
          mode: normal
          maxRetries: 5
          retryableCodes:
            - EMPTY_RESPONSE
            - RATE_LIMIT
            - SERVER
            - TIMEOUT
            - TRANSPORT
            - MALFORMED_RESPONSE
          backoff:
            initialDelayMs: 500
            maxDelayMs: 10000
            jitterRatio: 0.1

        # The account's credits, as the product's own widget reads them: how often the sweep reads the
        # vendor's account, and whether that sweep takes what is claimable before it expires.
        #
        # Both numbers are ours, not the donor's. The donor swept every five minutes and claimed
        # automatically; what those five minutes bought was a figure almost live — and what they cost
        # was a write into the profile's patch file on every tick. This widget's figures come over a
        # route and write no file, so the cadence buys only freshness and the collection's own timing:
        # the vendor's reward window opens once a day, so ten minutes keeps the figure as useful as five
        # would at half the requests. A row outside the plugin's bounds is told so in the log and given
        # the nearest honest value instead of being obeyed or refused.
        credits:
          sweepMs: 600000
          autoClaim: true

    # The rules' row: host-only, like the journal's — it registers one prompt section carrying the
    # rules of this project that must hold without a reader acting, and it has no browser half.
    #
    # Its one setting is the section's placement, and the shipped number is the plugin's own schema
    # default: the row deliberately does NOT restate it, because one number has one owner and the
    # number was read where it stands — the platform's own scale, in the slot left free between its
    # plan and team policies (500, 600) and its first tool guide (800). A profile that wants the
    # section elsewhere writes `order` in its own patch.
    #
    # The rules themselves are not a knob: their text is one file of the plugin, and this row carries
    # none of it. A plugin mounted where the platform's prompt service is absent stays pending — the
    # launcher names it among the entries that did not activate — rather than mounting over nothing.
    - id: coreness-rules
      name: '@coreness/dsh/plugins/rules'
