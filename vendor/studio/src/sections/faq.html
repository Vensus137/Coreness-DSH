<section class="s s-faq" id="{{id}}"{{?band}} data-band="surface"{{/band}}{{?heading}} aria-labelledby="{{headingId}}"{{/heading}}>
  <div class="wrap stack">
    {{?number}}<p class="ann ann--number" aria-hidden="true">{{number}}</p>{{/number}}
    {{?heading}}<h2 class="t-h1" id="{{headingId}}">{{heading}}</h2>{{/heading}}
    <dl class="s-faq__list">
      {{#items}}<div class="s-faq__item"><dt class="t-h3">{{q}}</dt><dd class="t-body">{{a}}</dd></div>{{/items}}
    </dl>
  </div>
</section>
