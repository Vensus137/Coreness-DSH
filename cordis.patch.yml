# The bundle's rows: the page, the rules, MCP, OAuth, the Qoder route and the rate gate.
- insert:
    - id: coreness-ui
      name: '@coreness/ui'
    - id: coreness-rules
      name: '@coreness/rules'
    - id: coreness-mcp
      name: '@coreness/mcp'
    - id: mcp-servers
      name: cordis:include
      config:
        path: ./mcp-servers.yml
        initial: []
    - id: coreness-oauth
      name: '@coreness/oauth'
    - id: coreness-qoder
      name: '@coreness/qoder'
      config:
        # The package's default first byte is 15 s; this row pins 60 s — a profile value, not a copy of a default.
        firstByteCeilingMs: 60000
        retryPolicy:
          mode: normal
          maxRetries: 5
          retryableCodes:
            - EMPTY_RESPONSE
            - RATE_LIMIT
            - SERVER
            - TIMEOUT
            - TRANSPORT
            - MALFORMED_RESPONSE
          backoff:
            initialDelayMs: 500
            maxDelayMs: 10000
            jitterRatio: 0.1
    - id: coreness-rate-gate
      name: '@coreness/rate-gate'
# The Agent Team's own rows belong to the platform's bundle: one row id has one owner, and a profile that
# carries both bundles would declare `agent-team` twice — the Loader keeps the last, and the profile's
# editor refuses to write a row two layers answer for. The product adds its ceiling door and its paragraph,
# and both read the row the platform mounted.
- insert:
    - id: coreness-team
      name: '@coreness/team'
