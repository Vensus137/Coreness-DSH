<section class="slide" data-layout="{{layout}}" aria-labelledby="{{headingId}}"{{?hidden}} hidden{{/hidden}}>
  <div class="slide__head"></div>
  <div class="slide__body slide__body--center">
    <h2 class="t-statement" id="{{headingId}}">{{text}}</h2>
    <div class="slide__attr"><p class="t-label">{{attribution}}{{?role}}, {{role}}{{/role}}</p></div>
  </div>
  <div class="slide__foot"></div>
</section>
